<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1113" />
    <meta name="description" content="A meditation timer set in a mountain gorge." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Meditation</title>
  </head>
  <body>
    <main class="app" data-phase="idle">
      <div class="scene" aria-hidden="true">
        <div class="camera">
          <video class="turn" muted playsinline preload="auto"></video>
          <canvas class="parallax"></canvas>
          <canvas class="effects"></canvas>
        </div>
        <div class="shade"></div>
      </div>

      <section class="setup" aria-label="Session">
        <button class="icon info" type="button" aria-label="Credits">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5M12 7.8v.1" /></svg>
        </button>

        <div class="duration">
          <div class="minutes" role="spinbutton" tabindex="0" aria-label="Minutes" aria-valuemin="1" aria-valuemax="120">
            <span class="value">12</span><span class="unit">min</span>
          </div>
          <div class="presets" role="group" aria-label="Presets">
            <button type="button" data-minutes="8">8</button><i></i>
            <button type="button" data-minutes="12">12</button><i></i>
            <button type="button" data-minutes="20">20</button>
          </div>
        </div>

        <div class="options">
          <button class="icon warmup" type="button">
            <svg viewBox="0 0 32 32"><circle class="track" cx="16" cy="16" r="12" /><circle class="arc" cx="16" cy="16" r="12" pathLength="60" /></svg>
            <span class="seconds"></span>
          </button>
          <button class="icon water" type="button" aria-label="Water sound">
            <svg viewBox="0 0 24 24"><path d="M3 9.5c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0M3 14.5c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0" /><path class="slash" d="M5 19 19 5" /></svg>
          </button>
          <button class="icon bowl" type="button">
            <svg viewBox="0 0 24 24"><path d="M3.5 11.5h17a8.5 7 0 0 1-17 0Z" /><path d="M9 20.5h6" /><path class="ring" d="M8.5 7.5c2-1.6 5-1.6 7 0M6 5c3.4-2.6 8.6-2.6 12 0" /></svg>
            <span class="pips"></span>
          </button>
        </div>

        <button class="start" type="button" aria-label="Start">
          <svg viewBox="0 0 24 24"><path d="M9.5 7.5v9l7.5-4.5Z" /></svg>
        </button>

        <div class="dots" role="group" aria-label="Scene">
          <button type="button" data-scene="waterfall" aria-label="Waterfall"></button>
          <button type="button" data-scene="bridge" aria-label="Bridge"></button>
        </div>
      </section>

      <section class="running" aria-label="Session in progress">
        <div class="countdown" role="timer">
          <button class="reveal" type="button" aria-label="Show controls" aria-controls="session-actions" aria-expanded="false"></button>
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" pathLength="1000" /></svg>
          <span class="clock"></span>
        </div>
        <div class="actions" id="session-actions">
          <button class="icon skip" type="button" aria-label="Skip warm-up">
            <svg viewBox="0 0 24 24"><path d="m6.5 7 5 5-5 5M12.5 7l5 5-5 5" /></svg>
          </button>
          <button class="icon cancel" type="button" aria-label="Cancel">
            <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" /></svg>
          </button>
          <button class="icon end" type="button" aria-label="End session">
            <svg viewBox="0 0 24 24"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5" /></svg>
          </button>
        </div>
      </section>

      <dialog class="credits" aria-label="Credits">
        <div class="credits-body"></div>
        <form method="dialog"><button class="icon" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" /></svg></button></form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
