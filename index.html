<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A simple meditation timer with singing bowls." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Meditation</title>
  </head>
  <body data-ui="setup">
    <section class="setup" aria-label="Session settings">
      <div class="field">
        <div class="minutes">
          <button type="button" class="step" data-step="-1" aria-label="One minute less">−</button>
          <output id="minutes" aria-live="polite">12</output>
          <button type="button" class="step" data-step="1" aria-label="One minute more">+</button>
        </div>
        <div class="label">minutes</div>
        <div class="chips" id="presets">
          <button type="button" data-minutes="8">8</button>
          <button type="button" data-minutes="12">12</button>
          <button type="button" data-minutes="20">20</button>
        </div>
      </div>

      <div class="field">
        <div class="label">warm-up</div>
        <div class="chips" id="warmups"></div>
      </div>

      <div class="field">
        <div class="label">gong <span class="hint">(tap to listen)</span></div>
        <div class="chips" id="bowls"></div>
      </div>

      <button type="button" id="start" class="primary">Start</button>
      <p id="message" role="status"></p>

      <details class="credits">
        <summary>Sound credits</summary>
        <p>
          Himalayan, Resonant, Bright, Deep and Tingsha: recordings by
          <a href="https://freesound.org/people/Cpt_Asteroid/" target="_blank" rel="noreferrer">Cpt_Asteroid</a>
          (Freesound, <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noreferrer">CC BY-NC 4.0</a>).
          Warm: “TIBETAN BOWL - 4” by SamuelGremaud; Soft: “Singing bowl (hit)” by Sanc000 (Freesound, CC0).
          All shortened and level-matched.
        </p>
        <p id="build"></p>
      </details>
    </section>

    <section class="running" aria-label="Session">
      <div class="phase" id="phase"></div>
      <div class="countdown" id="countdown" role="timer">0:00</div>
      <div class="controls">
        <button type="button" id="resume" class="quiet">Resume</button>
        <button type="button" id="cancel" class="quiet">Cancel</button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
